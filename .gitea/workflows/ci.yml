name: NFL Scores CI (canonical)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Source import leaves Gitea Actions disabled until the parent completes
# runner onboarding. Once enabled, this is the only forge CI adapter allowed
# to execute for the canonical repository.
concurrency:
  group: nfl-scores-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: >-
      vars.NFL_SCORES_CANONICAL_FORGE == 'gitea' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: homelab
    timeout-minutes: 10
    container:
      image: ubuntu:26.04@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78
    steps:
      - name: Install short-check dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git nodejs python3 libglib2.0-bin
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run offline checks
        run: ./ci/check

  package:
    if: >-
      vars.NFL_SCORES_CANONICAL_FORGE == 'gitea' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: check
    runs-on: homelab
    timeout-minutes: 15
    container:
      image: ubuntu:26.04@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78
    steps:
      - name: Install package-check dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git nodejs python3 libglib2.0-bin gnome-shell
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and test the downloaded release artifact
        run: |
          output="$RUNNER_TEMP/nfl-scores-release/nfl-scores@shanekanterman.shell-extension.zip"
          mkdir -p "$(dirname "$output")"
          ./ci/package --output "$output"
          ./ci/test-artifact "$output"
          ./ci/test-artifact --self-test
      - uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3 (Gitea-compatible)
        with:
          name: nfl-scores-artifact-${{ github.sha }}
          path: ${{ runner.temp }}/nfl-scores-release/
          if-no-files-found: error
          retention-days: 7
