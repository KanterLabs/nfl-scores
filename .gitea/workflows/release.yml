name: NFL Scores release (canonical Gitea)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact 40-character commit SHA to package
        required: true
        type: string
      version:
        description: Semantic release version; must match ci/runtime.json
        required: true
        default: 0.1.0
        type: string
      publish:
        description: Publish the verified ZIP through Gitea
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# The imported canonical repository keeps Actions disabled until the parent
# wires the runner. This adapter is the only release executor once enabled.
concurrency:
  group: nfl-scores-release-${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_CONFIG: ci/release.json

jobs:
  plan:
    if: vars.NFL_SCORES_CANONICAL_FORGE == 'gitea'
    runs-on: homelab
    timeout-minutes: 5
    container:
      image: ubuntu:26.04@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      version: ${{ steps.identity.outputs.version }}
      publish: ${{ steps.identity.outputs.publish }}
    steps:
      - name: Install plan tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git python3
      - name: Check out the exact release revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.release_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source, tag, and release contract
        id: identity
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          RELEASE_REF: ${{ github.event_name == 'push' && github.sha || inputs.release_ref }}
          PUBLISH_REQUESTED: ${{ github.event_name == 'push' && 'true' || inputs.publish }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'release_ref must be a lower-case 40-character SHA' >&2; exit 2; }
          test "$(git rev-parse HEAD)" = "$RELEASE_REF"
          expected_version=$(python3 -c 'import json; print(json.load(open("ci/runtime.json", encoding="utf-8"))["version"])')
          release_version="$RELEASE_VERSION"
          if [[ "${{ github.event_name }}" == push ]]; then
            test "${{ github.ref_name }}" = "v$expected_version"
            release_version=${RELEASE_VERSION#v}
          fi
          test "$release_version" = "$expected_version"
          python3 scripts/validate-release-config.py
          printf 'source_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$release_version" >> "$GITHUB_OUTPUT"
          printf 'publish=%s\n' "$PUBLISH_REQUESTED" >> "$GITHUB_OUTPUT"

  package:
    if: vars.NFL_SCORES_CANONICAL_FORGE == 'gitea'
    needs: plan
    runs-on: homelab
    timeout-minutes: 10
    container:
      image: ubuntu:26.04@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78
    steps:
      - name: Install package tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git nodejs python3 libglib2.0-bin gnome-shell
      - name: Check out planned revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build and verify the exact release bundle
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          candidate="$RUNNER_TEMP/nfl-scores-candidate"
          artifacts="$candidate/artifacts"
          mkdir -p "$artifacts"
          output="$artifacts/nfl-scores@shanekanterman.shell-extension.zip"
          ./ci/check
          ./ci/package --output "$output"
          ./ci/test-artifact "$output"
          ./ci/test-artifact --self-test
          python3 ci/release-tools.py manifest \
            --config "$RELEASE_CONFIG" \
            --artifacts "$artifacts" \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_SHA" \
            --output "$candidate/manifest.json"
          python3 ci/release-tools.py verify \
            --manifest "$candidate/manifest.json" \
            --artifacts "$artifacts"
      - uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3 (Gitea-compatible)
        with:
          name: nfl-scores-release-${{ github.run_id }}
          path: ${{ runner.temp }}/nfl-scores-candidate/
          if-no-files-found: error
          retention-days: 7

  runtime-ubuntu:
    name: Ubuntu 26.04 / GNOME 50 runtime harness
    if: vars.NFL_SCORES_CANONICAL_FORGE == 'gitea' && vars.NFL_SCORES_UBUNTU_GNOME_HARNESS == 'ready'
    needs: [plan, package]
    runs-on: homelab-heavy
    timeout-minutes: 25
    steps:
      - name: Check out planned revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download the candidate bundle
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2 (Gitea-compatible)
        with:
          name: nfl-scores-release-${{ github.run_id }}
          path: ${{ runner.temp }}/nfl-scores-candidate
      - name: Run the parent Ubuntu GNOME harness
        env:
          HARNESS_COMMAND: ${{ vars.NFL_SCORES_UBUNTU_GNOME_HARNESS_COMMAND }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          test -n "$HARNESS_COMMAND" || { echo 'Ubuntu GNOME harness command is not configured' >&2; exit 2; }
          read -r -a command <<< "$HARNESS_COMMAND"
          "${command[@]}" --run \
            --artifact "$RUNNER_TEMP/nfl-scores-candidate/artifacts/nfl-scores@shanekanterman.shell-extension.zip" \
            --artifact-root "$RUNNER_TEMP/nfl-scores-candidate/artifacts" \
            --artifact-type gnome-zip \
            --version "$RELEASE_VERSION" \
            --expected-uuid nfl-scores@shanekanterman

  runtime-fedora:
    name: Fedora Workstation 43 / GNOME 49 runtime harness
    if: vars.NFL_SCORES_CANONICAL_FORGE == 'gitea' && vars.NFL_SCORES_FEDORA_GNOME_HARNESS == 'ready'
    needs: [plan, package]
    runs-on: homelab-heavy
    timeout-minutes: 25
    steps:
      - name: Check out planned revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download the candidate bundle
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2 (Gitea-compatible)
        with:
          name: nfl-scores-release-${{ github.run_id }}
          path: ${{ runner.temp }}/nfl-scores-candidate
      - name: Run the parent Fedora GNOME harness
        env:
          HARNESS_COMMAND: ${{ vars.NFL_SCORES_FEDORA_GNOME_HARNESS_COMMAND }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          test -n "$HARNESS_COMMAND" || { echo 'Fedora GNOME harness command is not configured' >&2; exit 2; }
          read -r -a command <<< "$HARNESS_COMMAND"
          "${command[@]}" --run \
            --artifact "$RUNNER_TEMP/nfl-scores-candidate/artifacts/nfl-scores@shanekanterman.shell-extension.zip" \
            --artifact-root "$RUNNER_TEMP/nfl-scores-candidate/artifacts" \
            --artifact-type gnome-zip \
            --version "$RELEASE_VERSION" \
            --expected-uuid nfl-scores@shanekanterman

  release-gate:
    if: always() && vars.NFL_SCORES_CANONICAL_FORGE == 'gitea'
    needs: [plan, package, runtime-ubuntu, runtime-fedora]
    runs-on: homelab
    timeout-minutes: 5
    container:
      image: ubuntu:26.04@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78
    steps:
      - name: Require every release target
        env:
          PLAN: ${{ needs.plan.result }}
          PACKAGE: ${{ needs.package.result }}
          UBUNTU: ${{ needs.runtime-ubuntu.result }}
          FEDORA: ${{ needs.runtime-fedora.result }}
        run: |
          test "$PLAN" = success
          test "$PACKAGE" = success
          test "$UBUNTU" = success || { echo 'Ubuntu GNOME harness is not ready or failed' >&2; exit 1; }
          test "$FEDORA" = success || { echo 'Fedora GNOME harness is not ready or failed' >&2; exit 1; }
      - name: Install release-gate tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git nodejs python3 libglib2.0-bin gnome-shell
      - name: Check out planned revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify the exact tested bundle
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2 (Gitea-compatible)
        with:
          name: nfl-scores-release-${{ github.run_id }}
          path: ${{ runner.temp }}/nfl-scores-candidate
      - name: Verify release bytes
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.plan.outputs.source_sha }}"
          ./ci/test-artifact "$RUNNER_TEMP/nfl-scores-candidate/artifacts/nfl-scores@shanekanterman.shell-extension.zip"
          python3 ci/release-tools.py verify \
            --manifest "$RUNNER_TEMP/nfl-scores-candidate/manifest.json" \
            --artifacts "$RUNNER_TEMP/nfl-scores-candidate/artifacts"

  publish-gitea:
    if: needs.release-gate.result == 'success' && needs.plan.outputs.publish == 'true'
    needs: [plan, release-gate]
    runs-on: homelab
    timeout-minutes: 10
    permissions:
      contents: read
      releases: write
    container:
      image: ubuntu:26.04@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78
    env:
      GITEA_RELEASE_TOKEN: ${{ secrets.GITEA_TOKEN }}
    steps:
      - name: Install publisher tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git python3
      - name: Check out planned revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download the exact tested bundle
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2 (Gitea-compatible)
        with:
          name: nfl-scores-release-${{ github.run_id }}
          path: ${{ runner.temp }}/nfl-scores-candidate
      - name: Publish through the shared Gitea adapter
        run: |
          python3 ci/release-tools.py ensure-release \
            --forge gitea \
            --repository KanterLabs/nfl-scores \
            --api-url https://gitea.home.shanekanterman.dev/api/v1 \
            --manifest "$RUNNER_TEMP/nfl-scores-candidate/manifest.json" \
            --artifacts "$RUNNER_TEMP/nfl-scores-candidate/artifacts" \
            --receipt-output "$RUNNER_TEMP/nfl-scores-gitea-receipt.json"
