name: NFL Scores GNOME runtime smoke (canonical)

on:
  schedule:
    - cron: '31 18 * * 6'
  workflow_dispatch:

permissions:
  contents: read

# Gitea Actions is disabled on the imported repository until the parent wires
# the runner and GNOME harness. This adapter deliberately never substitutes a
# host-version check for a real enabled-extension session.
concurrency:
  group: nfl-scores-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: vars.NFL_SCORES_CANONICAL_FORGE == 'gitea'
    runs-on: homelab
    timeout-minutes: 10
    container:
      image: ubuntu:26.04@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78
    steps:
      - name: Install package-check dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git nodejs python3 libglib2.0-bin gnome-shell
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and test the exact ZIP
        run: |
          output="$RUNNER_TEMP/nfl-scores-runtime/nfl-scores@shanekanterman.shell-extension.zip"
          mkdir -p "$(dirname "$output")"
          ./ci/package --output "$output"
          ./ci/test-artifact "$output"
      - uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3 (Gitea-compatible)
        with:
          name: nfl-scores-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}/nfl-scores-runtime/
          if-no-files-found: error
          retention-days: 3

  ubuntu-gnome50:
    name: Ubuntu 26.04 / GNOME 50 harness
    needs: package
    if: vars.NFL_SCORES_CANONICAL_FORGE == 'gitea' && vars.NFL_SCORES_UBUNTU_GNOME_HARNESS == 'ready'
    runs-on: homelab-heavy
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download the exact ZIP
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2 (Gitea-compatible)
        with:
          name: nfl-scores-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}/nfl-scores-runtime
      - name: Run the parent GNOME harness
        env:
          HARNESS_COMMAND: ${{ vars.NFL_SCORES_UBUNTU_GNOME_HARNESS_COMMAND }}
        run: |
          test -n "$HARNESS_COMMAND" || { echo 'Ubuntu GNOME harness command is not configured' >&2; exit 2; }
          read -r -a command <<< "$HARNESS_COMMAND"
          "${command[@]}" \
            --run \
            --artifact "$RUNNER_TEMP/nfl-scores-runtime/nfl-scores@shanekanterman.shell-extension.zip" \
            --artifact-type gnome-zip \
            --version 0.1.0 \
            --expected-uuid nfl-scores@shanekanterman

  fedora-gnome49:
    name: Fedora Workstation 43 / GNOME 49 harness
    needs: package
    if: vars.NFL_SCORES_CANONICAL_FORGE == 'gitea' && vars.NFL_SCORES_FEDORA_GNOME_HARNESS == 'ready'
    runs-on: homelab-heavy
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download the exact ZIP
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2 (Gitea-compatible)
        with:
          name: nfl-scores-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}/nfl-scores-runtime
      - name: Run the parent Fedora GNOME harness
        env:
          HARNESS_COMMAND: ${{ vars.NFL_SCORES_FEDORA_GNOME_HARNESS_COMMAND }}
        run: |
          test -n "$HARNESS_COMMAND" || { echo 'Fedora GNOME harness command is not configured' >&2; exit 2; }
          read -r -a command <<< "$HARNESS_COMMAND"
          "${command[@]}" \
            --run \
            --artifact "$RUNNER_TEMP/nfl-scores-runtime/nfl-scores@shanekanterman.shell-extension.zip" \
            --artifact-root "$RUNNER_TEMP/nfl-scores-runtime" \
            --artifact-type gnome-zip \
            --version 0.1.0 \
            --expected-uuid nfl-scores@shanekanterman
